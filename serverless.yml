service: cupify

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-north-1
  stage: dev

  environment:
    TOURNAMENTS_TABLE:
      Ref: TournamentsTable
    TEAMS_TABLE:
      Ref: TeamsTable
    MATCHES_TABLE:
      Ref: MatchesTable

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [TournamentsTable, Arn]
            - Fn::GetAtt: [TeamsTable, Arn]
            - Fn::GetAtt: [MatchesTable, Arn]

resources:
  Resources:
    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-Tournaments
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-Teams
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-Matches
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

functions:
  createTeam:
    handler: src/functions/teams.createTeamHandler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: post

  getAllTeams:
    handler: src/functions/teams.getAllTeamsHandler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: get

  getTeamById:
    handler: src/functions/teams.getTeamByIdHandler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: get

  updateTeam:
    handler: src/functions/teams.updateTeamHandler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: put

  deleteTeam:
    handler: src/functions/teams.deleteTeamHandler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: delete

  # ---------- Matches ----------
  getAllMatches:
    handler: src/functions/matches.getAllMatchesHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: get

  getMatchById:
    handler: src/functions/matches.getMatchByIdHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: get

  createMatch:
    handler: src/functions/matches.createMatchHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: post

  updateMatch:
    handler: src/functions/matches.updateMatchHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: put

  registerMatchResult:
    handler: src/functions/matches.registerResultHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}/result
          method: patch

  deleteMatch:
    handler: src/functions/matches.deleteMatchHandler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: delete
